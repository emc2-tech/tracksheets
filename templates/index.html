<!DOCTYPE html>
<html>
<head>
    <title>Editable Table</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <table id="table">
        <thead>
            <tr></tr> <!-- Will be filled dynamically -->
        </thead>
        <tbody></tbody>
    </table>

    <script>
        $(document).ready(function(){
            $.getJSON("/get_table", function(data) {
                let headers = Object.keys(data[0]);
                let thead = $("#table thead tr");
                headers.forEach(h => thead.append(`<th contenteditable="true">${h}</th>`));

                let tbody = $("#table tbody");
                data.forEach(row => {
                    let tr = $("<tr></tr>");
                    headers.forEach(h => {
                        tr.append(`<td contenteditable="true">${row[h]}</td>`);
                    });
                    tbody.append(tr);
                });
            });
        });
    </script>
</body>
</html>
